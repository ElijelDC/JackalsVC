name: Read Sean Manalo roster link

on:
  push:
    branches:
      - cursor/sean-manalo-d2m-link-75cb

jobs:
  read:
    runs-on: ubuntu-latest
    if: github.repository == 'ElijelDC/JackalsVC'
    steps:
      - name: Read production sqlite
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          command_timeout: 3m
          script: |
            set -euo pipefail
            APP_DIR=""
            for candidate in /opt/app /root/JackalsVC /root/app; do
              if [[ -d "$candidate/.git" ]]; then
                APP_DIR="$candidate"
                break
              fi
            done
            if [[ -z "$APP_DIR" ]]; then
              echo "Could not find the app directory."
              exit 1
            fi
            cd "$APP_DIR"
            echo "HOST $(git rev-parse --short HEAD) $(git log -1 --oneline)"
            docker compose --env-file .env.production exec -T app sh -c 'echo DATABASE_URL="$DATABASE_URL"; grep -R -l "No training team assigned" .next/server | head -5 || true'
