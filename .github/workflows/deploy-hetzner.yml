name: Deploy to Hetzner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: hetzner-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'ElijelDC/JackalsVC'
    steps:
      - name: Check Hetzner secrets
        id: secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_APP_DIR: ${{ secrets.HETZNER_APP_DIR }}
        run: |
          if [[ -z "$HETZNER_HOST" || -z "$HETZNER_USER" || -z "$HETZNER_SSH_KEY" || -z "$HETZNER_APP_DIR" ]]; then
            echo "::error::Hetzner deploy secrets are not fully configured — deploy was skipped."
            echo "Add these GitHub repo secrets: HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY, HETZNER_APP_DIR"
            echo "Or deploy manually: ./scripts/hetzner-deploy.sh (see docs/HETZNER-DEPLOY.md)"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Hetzner deploy secrets present."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.HETZNER_APP_DIR }}"
            if [[ ! -d "$APP_DIR" ]]; then
              echo "Configured HETZNER_APP_DIR does not exist: $APP_DIR"
              for candidate in /opt/app /root/JackalsVC /root/app; do
                if [[ -d "$candidate/.git" ]]; then
                  APP_DIR="$candidate"
                  echo "Using detected app directory: $APP_DIR"
                  break
                fi
              done
            fi
            if [[ ! -d "$APP_DIR" ]]; then
              echo "::error::Could not find the app directory on the server."
              echo "Set the HETZNER_APP_DIR secret to the repo path (production uses /opt/app)."
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file .env.production up -d --build --force-recreate app
            sleep 12
            docker compose exec -T app npx prisma migrate deploy || echo "migrate deploy skipped (startup db push handles schema)"
            docker compose ps
