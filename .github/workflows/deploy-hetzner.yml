name: Deploy to Hetzner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: hetzner-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ElijelDC/JackalsVC' &&
      secrets.HETZNER_HOST != '' &&
      secrets.HETZNER_USER != '' &&
      secrets.HETZNER_SSH_KEY != '' &&
      secrets.HETZNER_APP_DIR != ''
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.HETZNER_APP_DIR }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose --env-file .env.production up -d --build --force-recreate app
            sleep 8
            docker compose exec -T app npx prisma migrate deploy
            docker compose ps
