<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#202121" />
    <title>Setter · Preseason</title>
    <style>
      :root {
        --bg: #202121;
        --surface: #2a2b2b;
        --surface-muted: #252626;
        --inset: #181919;
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --dim: #71717a;
        --red: #e8222a;
        --red-light: #ff4d54;
        --green: #34d399;
        --amber: #fbbf24;
        --radius: 14px;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
        max-width: 100%;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
      }
      body {
        overflow-x: hidden;
        max-width: 100%;
        padding-bottom: calc(88px + var(--safe-bottom));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: none;
        background: none;
      }
      .app {
        width: 100%;
        max-width: min(520px, 100%);
        margin: 0 auto;
        padding: 16px 16px 0;
        overflow-x: hidden;
      }
      .hero {
        padding: 8px 4px 20px;
      }
      .hero h1 {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .hero h1 span {
        color: var(--red-light);
      }
      .hero-meta {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .progress-card {
        margin-top: 16px;
        padding: 16px;
        border-radius: var(--radius);
        background: linear-gradient(135deg, rgba(232, 34, 42, 0.18), rgba(42, 43, 43, 0.95));
        border: 1px solid rgba(232, 34, 42, 0.25);
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 14px;
        align-items: center;
      }
      .ring {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: conic-gradient(
          var(--red) calc(var(--pct) * 1%),
          rgba(255, 255, 255, 0.08) 0
        );
        display: grid;
        place-items: center;
        position: relative;
      }
      .ring::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: var(--surface-muted);
      }
      .ring span {
        position: relative;
        z-index: 1;
        font-weight: 800;
        font-size: 0.95rem;
      }
      .progress-copy strong {
        display: block;
        font-size: 1rem;
        margin-bottom: 4px;
      }
      .progress-copy p {
        margin: 0;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        padding: 4px;
        background: var(--inset);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .tab {
        flex: 1;
        padding: 10px 8px;
        border-radius: 9px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
        transition: background 0.15s, color 0.15s;
      }
      .tab.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .week-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
        padding-bottom: 4px;
        margin-bottom: 14px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .week-strip::-webkit-scrollbar {
        display: none;
      }
      .week-chip {
        flex: 0 0 auto;
        min-width: 64px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: var(--surface);
        text-align: center;
      }
      .week-chip.active {
        border-color: rgba(232, 34, 42, 0.55);
        background: rgba(232, 34, 42, 0.12);
      }
      .week-chip .num {
        font-weight: 800;
        font-size: 1.05rem;
      }
      .week-chip .lbl {
        font-size: 0.65rem;
        color: var(--muted);
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .day-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .day-card {
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: var(--surface);
        overflow: hidden;
      }
      .day-card.rest {
        opacity: 0.72;
      }
      .day-head {
        width: 100%;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
      }
      .day-head .title {
        font-weight: 700;
        font-size: 0.95rem;
      }
      .day-head .sub {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 3px;
      }
      .day-badge {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--inset);
        color: var(--muted);
        white-space: nowrap;
      }
      .day-badge.done {
        background: rgba(52, 211, 153, 0.15);
        color: var(--green);
      }
      .day-body {
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        padding: 0 12px 12px;
      }
      .exercise {
        margin-top: 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface-muted);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .exercise.done {
        border-color: rgba(52, 211, 153, 0.25);
      }
      .ex-top {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .cat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 6px;
        flex-shrink: 0;
      }
      .ex-info {
        flex: 1;
        min-width: 0;
      }
      .ex-name {
        font-weight: 700;
        font-size: 0.92rem;
        line-height: 1.3;
      }
      .ex-prescription {
        margin-top: 4px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .ex-notes {
        margin-top: 8px;
        font-size: 0.75rem;
        color: var(--dim);
        line-height: 1.4;
      }
      .set-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .set-btn {
        min-width: 44px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--inset);
        font-size: 0.78rem;
        font-weight: 600;
        transition: transform 0.1s, border-color 0.15s, background 0.15s;
      }
      .set-btn:active {
        transform: scale(0.96);
      }
      .set-btn.done {
        background: rgba(52, 211, 153, 0.2);
        border-color: rgba(52, 211, 153, 0.45);
        color: var(--green);
      }
      .ex-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .btn-sm {
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 0.72rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--inset);
        color: var(--muted);
      }
      .btn-sm.primary {
        background: rgba(232, 34, 42, 0.2);
        border-color: rgba(232, 34, 42, 0.45);
        color: var(--red-light);
      }
      .btn-sm.danger {
        color: #fca5a5;
        border-color: rgba(248, 113, 113, 0.35);
      }
      .edit-fields {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .edit-fields label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--dim);
        display: block;
        margin-bottom: 4px;
      }
      .edit-fields input,
      .edit-fields select,
      .edit-fields textarea {
        width: 100%;
        padding: 9px 10px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--inset);
      }
      .edit-fields textarea {
        min-height: 56px;
        resize: vertical;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .toolbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px 16px calc(10px + var(--safe-bottom));
        background: rgba(24, 25, 25, 0.92);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 8px;
        justify-content: center;
        max-width: 520px;
        margin: 0 auto;
      }
      .toolbar button {
        flex: 1;
        max-width: 160px;
        padding: 12px 14px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.82rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--surface);
      }
      .toolbar button.accent {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      .timer-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .timer-overlay.open {
        display: flex;
      }
      .timer-card {
        width: min(100%, 320px);
        padding: 28px 24px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }
      .timer-card .time {
        font-size: 3.2rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
      }
      .timer-card p {
        margin: 8px 0 20px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .tools-card {
        padding: 16px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 12px;
      }
      .tools-card h3 {
        margin: 0 0 10px;
        font-size: 0.9rem;
      }
      .tools-card p {
        margin: 0 0 12px;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .tools-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tools-actions button {
        padding: 12px 14px;
        border-radius: 11px;
        font-weight: 600;
        font-size: 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--inset);
        text-align: left;
      }
      .tools-actions button.primary {
        background: rgba(232, 34, 42, 0.2);
        border-color: rgba(232, 34, 42, 0.45);
        color: var(--red-light);
      }
      .update-banner {
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(232, 34, 42, 0.12);
        border: 1px solid rgba(232, 34, 42, 0.35);
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .update-banner p {
        margin: 0;
        flex: 1;
        font-size: 0.8rem;
        line-height: 1.45;
        color: var(--text);
      }
      .update-banner button {
        flex-shrink: 0;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.72rem;
        font-weight: 700;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: var(--surface);
        color: var(--muted);
      }
      .hidden-input {
        display: none;
      }
      .empty {
        padding: 24px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .day-card.open {
        border-color: rgba(232, 34, 42, 0.45);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      .day-body {
        animation: slideDown 0.22s ease-out;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .set-btn.done {
        animation: popDone 0.25s ease;
      }
      @keyframes popDone {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }
      .video-btn {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: var(--inset);
        text-align: left;
        overflow: hidden;
        transition: border-color 0.15s, transform 0.1s;
      }
      .video-btn:active {
        transform: scale(0.98);
      }
      .video-btn:hover {
        border-color: rgba(232, 34, 42, 0.4);
      }
      .video-thumb {
        width: 88px;
        height: 52px;
        border-radius: 8px;
        object-fit: cover;
        flex-shrink: 0;
        background: #111;
      }
      .video-copy {
        flex: 1;
        min-width: 0;
      }
      .video-copy strong {
        display: block;
        font-size: 0.78rem;
        color: var(--red-light);
      }
      .video-copy span {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .video-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.88);
        display: none;
        flex-direction: column;
        padding: 16px;
        padding-bottom: calc(16px + var(--safe-bottom));
      }
      .video-overlay.open {
        display: flex;
      }
      .video-overlay-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 12px;
      }
      .video-overlay-header h2 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.3;
      }
      .video-frame-wrap {
        flex: 1;
        min-height: 0;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #000;
      }
      .video-frame-wrap iframe {
        width: 100%;
        height: 100%;
        min-height: min(56vw, 320px);
        border: 0;
      }
      .hero-glow {
        position: absolute;
        inset: -40% -20% auto;
        height: 200px;
        background: radial-gradient(ellipse, rgba(232, 34, 42, 0.2), transparent 70%);
        pointer-events: none;
      }
      .hero-wrap {
        position: relative;
        overflow: hidden;
      }
      .video-overlay-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .video-overlay-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text);
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
      }
      .video-overlay-actions a:active {
        transform: scale(0.98);
      }
      @media (min-width: 520px) {
        .app {
          padding-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app"></div>

    <div class="toolbar" id="toolbar">
      <button type="button" id="btn-edit">Edit plan</button>
      <button type="button" class="accent" id="btn-add-day">+ Session</button>
    </div>

    <div class="video-overlay" id="video-overlay" aria-hidden="true">
      <div class="video-overlay-header">
        <h2 id="video-title">Exercise demo</h2>
        <button type="button" class="btn-sm" id="video-close">Close</button>
      </div>
      <div class="video-overlay-actions" id="video-overlay-actions"></div>
      <div class="video-frame-wrap" id="video-frame-wrap"></div>
    </div>

    <div class="timer-overlay" id="timer-overlay" aria-hidden="true">
      <div class="timer-card">
        <div class="time" id="timer-display">0:00</div>
        <p id="timer-label">Rest</p>
        <button type="button" class="btn-sm primary" id="timer-close" style="width: 100%">
          Done
        </button>
      </div>
    </div>

      const CATEGORY_VIDEO_FALLBACK = {

      function sanitizeVideoId(id) {
        if (!id || typeof id !== "string") return "";
        const clean = id.trim();
        return VALID_VIDEO_IDS.has(clean) ? clean : "";
      }

      function lookupVideoId(name, category) {
        const n = name.toLowerCase();
        for (const [keyword, id] of VIDEO_BY_KEYWORD) {
          if (n.includes(keyword)) {
            const safe = sanitizeVideoId(id);
            if (safe) return safe;
          }
        }
        return (
          sanitizeVideoId(CATEGORY_VIDEO_FALLBACK[category]) ||
          CATEGORY_VIDEO_FALLBACK.strength
        );
      }

      function exerciseVideoId(ex) {
        const custom = sanitizeVideoId(ex.videoId);
        if (custom) return custom;
        return lookupVideoId(ex.name, ex.category);
      }

      function loadWorkoutTemplate() {
        if (WORKOUT_TEMPLATE) return WORKOUT_TEMPLATE;
        const el = document.getElementById("setter-workout-template-data");
        if (!el?.textContent?.trim()) throw new Error("template_load_failed");
        WORKOUT_TEMPLATE = JSON.parse(el.textContent);
        return WORKOUT_TEMPLATE;
      }

      function targetTemplateVersion() {
        return WORKOUT_TEMPLATE?.planTemplateVersion ?? APP_RELEASE_VERSION;
      }

      function mkExerciseFromTemplate(ex) {
        const sets = Number(ex.sets) || 1;
        return {
          id: uid(),
          name: ex.name,
          category: ex.category,
          sets,
          reps: ex.reps ?? "—",
          load: ex.load ?? "—",
          restSec: Number(ex.restSec) || 0,
          notes: ex.notes ?? "",
          videoId: lookupVideoId(ex.name, ex.category),
          doneSets: Array.from({ length: sets }, () => false),
        };
      }

      function hydratePlanFromTemplate(tpl) {
        return {
          version: 1,
          planTemplateVersion: tpl.planTemplateVersion,
          videoCatalogVersion: VIDEO_CATALOG_VERSION,
          appReleaseVersion: APP_RELEASE_VERSION,
          title: tpl.title,
          subtitle: tpl.subtitle,
          weeks: tpl.weeks.map((w) => ({
            id: uid(),
            name: w.name,
            theme: w.theme,
            days: w.days.map((d) => ({
              id: uid(),
              label: d.label,
              title: d.title,
              focus: d.focus,
              rest: Boolean(d.rest),
              exercises: (d.exercises || []).map((ex) => mkExerciseFromTemplate(ex)),
            })),
          })),
        };
      }

      function defaultPlan() {
        if (!WORKOUT_TEMPLATE) {
          throw new Error("Workout template not loaded");
        }
        return hydratePlanFromTemplate(WORKOUT_TEMPLATE);
      }

      let pendingUpdateNotice = false;

      let state = {
        plan: null,
        weekIndex: 0,
        openDayId: null,
        tab: "week",
        editMode: false,
        updateNotice: false,
        templateVersion: null,
      };

      let timerInterval = null;
      let timerRemaining = 0;

      function loadPlan() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            raw =
              localStorage.getItem("setter-preseason-workout-plan-v2") ||
              localStorage.getItem("setter-preseason-workout-plan-v1");
          }
          if (!raw) return defaultPlan();
          const parsed = JSON.parse(raw);
          if (!parsed.weeks?.length) return defaultPlan();
          let plan = migratePlan(parsed);
          const needsTemplate =
            !plan.planTemplateVersion ||
            plan.planTemplateVersion < targetTemplateVersion() ||
            !plan.appReleaseVersion ||
            plan.appReleaseVersion < APP_RELEASE_VERSION;
          if (needsTemplate) {
            plan = applyLatestTemplateUpdates(plan);
            pendingUpdateNotice = true;
          }
          savePlanToStorage(plan);
          return plan;
        } catch {
          return defaultPlan();
        }
      }

      function savePlanToStorage(plan) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(plan));
      }

      function migratePlan(plan) {
        const needsVideoRefresh =
          !plan.videoCatalogVersion || plan.videoCatalogVersion < VIDEO_CATALOG_VERSION;
        for (const week of plan.weeks) {
          for (const day of week.days) {
            for (const ex of day.exercises) {
              if (!ex.doneSets || ex.doneSets.length !== ex.sets) {
                ex.doneSets = Array.from({ length: ex.sets }, (_, i) =>
                  Boolean(ex.doneSets?.[i]),
                );
              }
              if (needsVideoRefresh || !sanitizeVideoId(ex.videoId)) {
                ex.videoId = lookupVideoId(ex.name, ex.category);
              }
            }
          }
        }
        plan.videoCatalogVersion = VIDEO_CATALOG_VERSION;
        if (!plan.appReleaseVersion) {
          plan.appReleaseVersion = 0;
        }
        return plan;
      }

      function exerciseProgressKey(weekName, dayLabel, exName) {
        return `${weekName}\0${dayLabel}\0${exName}`.toLowerCase();
      }

      function resizeDoneSets(doneSets, setCount) {
        const next = Array.from({ length: setCount }, (_, i) => Boolean(doneSets?.[i]));
        return next;
      }

      function captureExerciseProgress(plan) {
        const map = new Map();
        for (const week of plan.weeks) {
          for (const day of week.days) {
            for (const ex of day.exercises) {
              map.set(exerciseProgressKey(week.name, day.label, ex.name), {
                doneSets: ex.doneSets,
              });
            }
          }
        }
        return map;
      }

      /** Merge newest default template + demo videos; keep logged sets for matching exercises. */
      function applyLatestTemplateUpdates(existingPlan) {
        const progress = captureExerciseProgress(existingPlan);
        const template = defaultPlan();
        const mergedWeeks = template.weeks.map((tWeek) => {
          const existingWeek = existingPlan.weeks.find((w) => w.name === tWeek.name);
          return {
            ...tWeek,
            id: existingWeek?.id || tWeek.id,
            days: tWeek.days.map((tDay) => {
              const existingDay = existingWeek?.days.find((d) => d.label === tDay.label);
              return {
                ...tDay,
                id: existingDay?.id || tDay.id,
                exercises: tDay.exercises.map((tEx) => {
                  const saved = progress.get(
                    exerciseProgressKey(tWeek.name, tDay.label, tEx.name),
                  );
                  const ex = { ...tEx };
                  if (saved?.doneSets) {
                    ex.doneSets = resizeDoneSets(saved.doneSets, ex.sets);
                  }
                  ex.videoId = lookupVideoId(ex.name, ex.category);
                  return ex;
                }),
              };
            }),
          };
        });

        const templateWeekNames = new Set(template.weeks.map((w) => w.name));
        const customWeeks = existingPlan.weeks
          .filter((w) => !templateWeekNames.has(w.name))
          .map((week) => {
            const copy = JSON.parse(JSON.stringify(week));
            for (const day of copy.days) {
              for (const ex of day.exercises) {
                ex.videoId = lookupVideoId(ex.name, ex.category);
              }
            }
            return copy;
          });

        return {
          ...template,
          title: template.title,
          subtitle: template.subtitle,
          weeks: [...mergedWeeks, ...customWeeks],
          videoCatalogVersion: VIDEO_CATALOG_VERSION,
          appReleaseVersion: APP_RELEASE_VERSION,
          planTemplateVersion: targetTemplateVersion(),
        };
      }

      function planNeedsTemplateUpdate(plan) {
        return (
          !plan.planTemplateVersion ||
          plan.planTemplateVersion < targetTemplateVersion() ||
          !plan.appReleaseVersion ||
          plan.appReleaseVersion < APP_RELEASE_VERSION
        );
      }

      function savePlan() {
        savePlanToStorage(state.plan);
      }

      function renderPreservingScroll() {
        const y = window.scrollY;
        render();
        requestAnimationFrame(() => window.scrollTo(0, y));
      }

      function openVideoModal(ex) {
        const videoId = exerciseVideoId(ex);
        const watchUrl = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}`;
        document.getElementById("video-title").textContent = ex.name;
        document.getElementById("video-overlay-actions").innerHTML = `<a href="${escapeAttr(
          watchUrl,
        )}" target="_blank" rel="noopener noreferrer">Open in YouTube</a>`;
        document.getElementById("video-frame-wrap").innerHTML = `<iframe
          src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?autoplay=1&rel=0&playsinline=1"
          title="${escapeAttr(ex.name)} demo"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>`;
        document.getElementById("video-overlay").classList.add("open");
        document.getElementById("video-overlay").setAttribute("aria-hidden", "false");
      }

      function closeVideoModal() {
        document.getElementById("video-frame-wrap").innerHTML = "";
        document.getElementById("video-overlay-actions").innerHTML = "";
        document.getElementById("video-overlay").classList.remove("open");
        document.getElementById("video-overlay").setAttribute("aria-hidden", "true");
      }

      function completionStats() {
        let total = 0;
        let done = 0;
        for (const week of state.plan.weeks) {
          for (const day of week.days) {
            if (day.rest) continue;
            for (const ex of day.exercises) {
              total += ex.sets;
              done += ex.doneSets.filter(Boolean).length;
            }
          }
        }
        return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
      }

      function weekStats(week) {
        let total = 0;
        let done = 0;
        for (const day of week.days) {
          if (day.rest) continue;
          for (const ex of day.exercises) {
            total += ex.sets;
            done += ex.doneSets.filter(Boolean).length;
          }
        }
        return { total, done };
      }

      function todayDayIndex() {
        const d = new Date().getDay();
        return d === 0 ? 6 : d - 1;
      }

      function formatRest(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function startTimer(seconds, label) {
        timerRemaining = seconds;
        document.getElementById("timer-label").textContent = label || "Rest";
        document.getElementById("timer-overlay").classList.add("open");
        document.getElementById("timer-overlay").setAttribute("aria-hidden", "false");
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timerRemaining -= 1;
          updateTimerDisplay();
          if (timerRemaining <= 0) {
            clearInterval(timerInterval);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        document.getElementById("timer-display").textContent = formatRest(
          Math.max(0, timerRemaining),
        );
      }

      function closeTimer() {
        clearInterval(timerInterval);
        document.getElementById("timer-overlay").classList.remove("open");
        document.getElementById("timer-overlay").setAttribute("aria-hidden", "true");
      }

      function toggleSet(ex, setIndex) {
        ex.doneSets[setIndex] = !ex.doneSets[setIndex];
        savePlan();
        if (navigator.vibrate) navigator.vibrate(12);
        renderPreservingScroll();
      }

      function resizeDoneSets(ex) {
        const n = Math.max(1, Number(ex.sets) || 1);
        ex.sets = n;
        const prev = ex.doneSets || [];
        ex.doneSets = Array.from({ length: n }, (_, i) => Boolean(prev[i]));
      }

      function renderExercise(ex, day) {
        const cat = CATEGORIES[ex.category] || CATEGORIES.strength;
        const allDone = ex.doneSets.every(Boolean);
        const edit = state.editMode;

        const setsHtml = ex.doneSets
          .map(
            (done, i) =>
              `<button type="button" class="set-btn${done ? " done" : ""}" data-action="set" data-ex="${ex.id}" data-i="${i}">${
                i + 1
              }</button>`,
          )
          .join("");

        const editHtml = edit
          ? `<div class="edit-fields">
          <div><label>Name</label><input data-field="name" data-ex="${ex.id}" value="${escapeAttr(
              ex.name,
            )}" /></div>
          <div class="grid-2">
            <div><label>Category</label><select data-field="category" data-ex="${ex.id}">
              ${Object.entries(CATEGORIES)
                .map(
                  ([k, v]) =>
                    `<option value="${k}"${ex.category === k ? " selected" : ""}>${v.label}</option>`,
                )
                .join("")}
            </select></div>
            <div><label>Sets</label><input type="number" min="1" data-field="sets" data-ex="${ex.id}" value="${ex.sets}" /></div>
          </div>
          <div class="grid-2">
            <div><label>Reps / time</label><input data-field="reps" data-ex="${ex.id}" value="${escapeAttr(
              ex.reps,
            )}" /></div>
            <div><label>Load</label><input data-field="load" data-ex="${ex.id}" value="${escapeAttr(
              ex.load,
            )}" /></div>
          </div>
          <div class="grid-2">
            <div><label>Rest (sec)</label><input type="number" min="0" data-field="restSec" data-ex="${ex.id}" value="${ex.restSec}" /></div>
            <div><label>YouTube video ID</label><input data-field="videoId" data-ex="${ex.id}" value="${escapeAttr(
              ex.videoId || "",
            )}" placeholder="e.g. MeHQebZwcJA" /></div>
          </div>
          <div><label>Notes</label><textarea data-field="notes" data-ex="${ex.id}">${escapeHtml(
              ex.notes || "",
            )}</textarea></div>
          <div class="ex-actions">
            <button type="button" class="btn-sm" data-action="move-up" data-ex="${ex.id}" data-day="${day.id}">↑</button>
            <button type="button" class="btn-sm" data-action="move-down" data-ex="${ex.id}" data-day="${day.id}">↓</button>
            <button type="button" class="btn-sm danger" data-action="delete-ex" data-ex="${ex.id}" data-day="${day.id}">Delete</button>
          </div>
        </div>`
          : `<button type="button" class="video-btn" data-action="video" data-ex="${ex.id}">
              <img class="video-thumb" src="https://i.ytimg.com/vi/${encodeURIComponent(
                exerciseVideoId(ex),
              )}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'" />
              <span class="video-copy"><strong>Watch demo</strong><span>Form cue video for this movement</span></span>
            </button>
          <div class="set-row">${setsHtml}</div>
          <div class="ex-actions">
            <button type="button" class="btn-sm primary" data-action="timer" data-ex="${ex.id}">Rest ${formatRest(
              ex.restSec || 60,
            )}</button>
          </div>`;

        return `<article class="exercise${allDone ? " done" : ""}">
          <div class="ex-top">
            <span class="cat-dot" style="background:${cat.color}"></span>
            <div class="ex-info">
              <div class="ex-name">${escapeHtml(ex.name)}</div>
              <div class="ex-prescription">${ex.sets} × ${escapeHtml(ex.reps)} · ${escapeHtml(
                ex.load,
              )} · ${cat.label}</div>
              ${ex.notes ? `<div class="ex-notes">${escapeHtml(ex.notes)}</div>` : ""}
            </div>
          </div>
          ${editHtml}
        </article>`;
      }

      function renderDay(day, week) {
        const stats = weekStats({ days: [day] });
        const dayDone =
          stats.total > 0 && stats.done === stats.total
            ? "done"
            : stats.done > 0
              ? ""
              : "";
        const open = state.openDayId === day.id;
        const edit = state.editMode;

        const head = `<button type="button" class="day-head" data-action="toggle-day" data-day="${day.id}">
          <div>
            <div class="title">${escapeHtml(day.label)} · ${escapeHtml(day.title)}</div>
            <div class="sub">${escapeHtml(day.focus)}${
              stats.total ? ` · ${stats.done}/${stats.total} sets` : ""
            }</div>
          </div>
          <span class="day-badge ${dayDone}">${day.rest ? "Rest" : open ? "Close" : "Open"}</span>
        </button>`;

        const editDay = edit
          ? `<div class="edit-fields" style="padding:12px">
            <div class="grid-2">
              <div><label>Day label</label><input data-day-field="label" data-day="${day.id}" value="${escapeAttr(
                day.label,
              )}" /></div>
              <div><label>Title</label><input data-day-field="title" data-day="${day.id}" value="${escapeAttr(
                day.title,
              )}" /></div>
            </div>
            <div><label>Focus</label><input data-day-field="focus" data-day="${day.id}" value="${escapeAttr(
              day.focus,
            )}" /></div>
            <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:0.8rem;color:var(--muted)">
              <input type="checkbox" data-day-field="rest" data-day="${day.id}" ${
                day.rest ? "checked" : ""
              } /> Rest / recovery day
            </label>
            <button type="button" class="btn-sm danger" data-action="delete-day" data-day="${day.id}" style="margin-top:8px">Delete session</button>
          </div>`
          : "";

        const body =
          open || edit
            ? `<div class="day-body">
              ${editDay}
              ${day.exercises.map((ex) => renderExercise(ex, day)).join("")}
              ${
                edit
                  ? `<button type="button" class="btn-sm primary" data-action="add-ex" data-day="${day.id}" style="margin-top:10px;width:100%">+ Exercise</button>`
                  : ""
              }
            </div>`
            : "";

        return `<div class="day-card${day.rest ? " rest" : ""}${open ? " open" : ""}">${head}${body}</div>`;
      }

      function render() {
        if (!state.plan) return;
        const { plan } = state;
        state.templateVersion = plan.planTemplateVersion ?? targetTemplateVersion();
        const week = plan.weeks[state.weekIndex] || plan.weeks[0];
        const stats = completionStats();
        const todayIdx = todayDayIndex();
        const todayDay = week?.days[todayIdx];

        document.getElementById("app").innerHTML = `
          <header class="hero hero-wrap">
            <div class="hero-glow" aria-hidden="true"></div>
            <h1>${escapeHtml(plan.title)} <span>plan</span></h1>
            <div class="hero-meta">
              <span class="pill">${escapeHtml(plan.subtitle || "Private")}</span>
              <span class="pill">${plan.weeks.length} weeks</span>
              <span class="pill">Saved on device</span>
              ${
                state.templateVersion
                  ? `<span class="pill">Template v${state.templateVersion}</span>`
                  : ""
              }
            </div>
            <div class="progress-card">
              <div class="ring" style="--pct:${stats.pct}"><span>${stats.pct}%</span></div>
              <div class="progress-copy">
                <strong>Program progress</strong>
                <p>${stats.done} of ${stats.total} working sets logged complete. Tap set numbers as you finish them.</p>
              </div>
            </div>
          </header>
          ${
            state.updateNotice
              ? `<div class="update-banner" role="status">
                  <p><strong>New preseason plan installed.</strong> Weeks 1–4 now match the latest template (v${targetTemplateVersion()}). Logged sets on matching exercises were kept.</p>
                  <button type="button" id="btn-dismiss-update">OK</button>
                </div>`
              : ""
          }
          <nav class="tabs" role="tablist">
            <button type="button" class="tab${state.tab === "week" ? " active" : ""}" data-tab="week">Week</button>
            <button type="button" class="tab${state.tab === "today" ? " active" : ""}" data-tab="today">Today</button>
            <button type="button" class="tab${state.tab === "tools" ? " active" : ""}" data-tab="tools">Tools</button>
          </nav>
          <section class="panel${state.tab === "week" ? " active" : ""}" id="panel-week">
            <div class="week-strip">
              ${plan.weeks
                .map(
                  (w, i) => `<button type="button" class="week-chip${
                    i === state.weekIndex ? " active" : ""
                  }" data-week="${i}">
                    <div class="num">${i + 1}</div>
                    <div class="lbl">${escapeHtml(w.name.replace("Week ", "W"))}</div>
                  </button>`,
                )
                .join("")}
            </div>
            <p style="font-size:0.8rem;color:var(--muted);margin:0 0 12px">${escapeHtml(
              week.theme,
            )}</p>
            <div class="day-list">${week.days.map((d) => renderDay(d, week)).join("")}</div>
          </section>
          <section class="panel${state.tab === "today" ? " active" : ""}" id="panel-today">
            ${
              todayDay
                ? `<p style="font-size:0.85rem;color:var(--muted);margin:0 0 12px">Week ${
                    state.weekIndex + 1
                  } · ${escapeHtml(todayDay.label)}</p>${renderDay(todayDay, week)}`
                : '<div class="empty">No session for today in this week.</div>'
            }
          </section>
          <section class="panel${state.tab === "tools" ? " active" : ""}" id="panel-tools">
            <div class="tools-card">
              <h3>Plan title</h3>
              <div class="edit-fields">
                <input id="plan-title" value="${escapeAttr(plan.title)}" />
                <input id="plan-subtitle" value="${escapeAttr(plan.subtitle || "")}" placeholder="Subtitle" />
              </div>
            </div>
            <div class="tools-card">
              <h3>App updates</h3>
              <p>
                Install the current 4-week preseason block (template v${targetTemplateVersion()}).
                Matching exercises keep your logged sets; new sessions and exercises are added.
              </p>
              <div class="tools-actions">
                <button type="button" class="primary" id="btn-apply-updates">
                  Install new workout plan
                </button>
              </div>
            </div>
            <div class="tools-card">
              <h3>Backup</h3>
              <p>Export JSON before big edits. Import restores a saved file.</p>
              <div class="tools-actions">
                <button type="button" id="btn-export">Export plan</button>
                <button type="button" id="btn-import">Import plan</button>
                <button type="button" id="btn-reset">Reset to default preseason template</button>
              </div>
            </div>
            <div class="tools-card">
              <h3>Weeks</h3>
              <div class="tools-actions">
                <button type="button" id="btn-add-week">+ Add week</button>
                <button type="button" id="btn-dup-week">Duplicate current week</button>
              </div>
            </div>
          </section>
        `;

        document.getElementById("btn-edit").textContent = state.editMode
          ? "Done editing"
          : "Edit plan";
        document.getElementById("btn-add-day").style.display = state.editMode ? "block" : "none";
        bindEvents();
      }

      function findExercise(id) {
        for (const week of state.plan.weeks) {
          for (const day of week.days) {
            const ex = day.exercises.find((e) => e.id === id);
            if (ex) return { ex, day, week };
          }
        }
        return null;
      }

      function findDay(id) {
        for (const week of state.plan.weeks) {
          const day = week.days.find((d) => d.id === id);
          if (day) return { day, week };
        }
        return null;
      }

      function bindEvents() {
        document.querySelectorAll("[data-tab]").forEach((el) => {
          el.addEventListener("click", () => {
            state.tab = el.dataset.tab;
            if (state.tab === "today") {
              const week = state.plan.weeks[state.weekIndex];
              const today = week?.days[todayDayIndex()];
              if (today) state.openDayId = today.id;
            }
            render();
          });
        });
        document.querySelectorAll("[data-week]").forEach((el) => {
          el.addEventListener("click", () => {
            state.weekIndex = Number(el.dataset.week);
            state.openDayId = null;
            render();
          });
        });
        document.querySelectorAll("[data-action='toggle-day']").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.dataset.day;
            state.openDayId = state.openDayId === id ? null : id;
            render();
          });
        });
        document.querySelectorAll(".day-body").forEach((el) => {
          el.addEventListener("click", (e) => e.stopPropagation());
        });
        document.querySelectorAll("[data-action='set']").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findExercise(el.dataset.ex);
            if (!found) return;
            toggleSet(found.ex, Number(el.dataset.i));
          });
        });
        document.querySelectorAll("[data-action='video']").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findExercise(el.dataset.ex);
            if (!found) return;
            openVideoModal(found.ex);
          });
        });
        document.querySelectorAll("[data-action='timer']").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.stopPropagation();
            const found = findExercise(el.dataset.ex);
            if (!found) return;
            startTimer(found.ex.restSec || 60, found.ex.name);
          });
        });
        document.querySelectorAll("[data-field]").forEach((el) => {
          const event = el.tagName === "SELECT" ? "change" : "input";
          el.addEventListener(event, () => {
            const found = findExercise(el.dataset.ex);
            if (!found) return;
            const field = el.dataset.field;
            if (field === "sets") {
              found.ex.sets = Number(el.value);
              resizeDoneSets(found.ex);
            } else {
              found.ex[field] = el.value;
            }
            savePlan();
            render();
          });
        });
        document.querySelectorAll("[data-day-field]").forEach((el) => {
          const event = el.type === "checkbox" ? "change" : "input";
          el.addEventListener(event, () => {
            const found = findDay(el.dataset.day);
            if (!found) return;
            const field = el.dataset.dayField;
            if (field === "rest") found.day.rest = el.checked;
            else found.day[field] = el.value;
            savePlan();
            render();
          });
        });
        document.querySelectorAll("[data-action='add-ex']").forEach((el) => {
          el.addEventListener("click", () => {
            const found = findDay(el.dataset.day);
            if (!found) return;
            found.day.exercises.push({
              id: uid(),
              name: "New exercise",
              category: "strength",
              sets: 3,
              reps: "10",
              load: "—",
              restSec: 60,
              notes: "",
              videoId: lookupVideoId("squat", "strength"),
              doneSets: [false, false, false],
            });
            savePlan();
            render();
          });
        });
        document.querySelectorAll("[data-action='delete-ex']").forEach((el) => {
          el.addEventListener("click", () => {
            const found = findDay(el.dataset.day);
            if (!found) return;
            found.day.exercises = found.day.exercises.filter((e) => e.id !== el.dataset.ex);
            savePlan();
            render();
          });
        });
        document.querySelectorAll("[data-action='move-up']").forEach((el) => {
          el.addEventListener("click", () => moveExercise(el.dataset.day, el.dataset.ex, -1));
        });
        document.querySelectorAll("[data-action='move-down']").forEach((el) => {
          el.addEventListener("click", () => moveExercise(el.dataset.day, el.dataset.ex, 1));
        });
        document.querySelectorAll("[data-action='delete-day']").forEach((el) => {
          el.addEventListener("click", () => {
            const found = findDay(el.dataset.day);
            if (!found || !confirm("Delete this session?")) return;
            found.week.days = found.week.days.filter((d) => d.id !== el.dataset.day);
            savePlan();
            render();
          });
        });

        const titleEl = document.getElementById("plan-title");
        const subEl = document.getElementById("plan-subtitle");
        if (titleEl) {
          titleEl.addEventListener("change", () => {
            state.plan.title = titleEl.value;
            savePlan();
            render();
          });
        }
        if (subEl) {
          subEl.addEventListener("change", () => {
            state.plan.subtitle = subEl.value;
            savePlan();
            render();
          });
        }

        const exportBtn = document.getElementById("btn-export");
        if (exportBtn) {
          exportBtn.onclick = () => {
            const blob = new Blob([JSON.stringify(state.plan, null, 2)], {
              type: "application/json",
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "setter-preseason-plan.json";
            a.click();
            URL.revokeObjectURL(a.href);
          };
        }
        const importBtn = document.getElementById("btn-import");
        if (importBtn) {
          importBtn.onclick = () => document.getElementById("import-file").click();
        }
        const resetBtn = document.getElementById("btn-reset");
        if (resetBtn) {
          resetBtn.onclick = () => {
            if (!confirm("Replace your plan with the default template?")) return;
            state.plan = defaultPlan();
            state.weekIndex = 0;
            state.updateNotice = false;
            savePlan();
            render();
          };
        }
        const applyUpdatesBtn = document.getElementById("btn-apply-updates");
        if (applyUpdatesBtn) {
          applyUpdatesBtn.onclick = () => {
            if (
              !confirm(
                "Update this plan from the latest app version? Logged sets on matching exercises are kept; export first if you want a backup.",
              )
            ) {
              return;
            }
            state.plan = applyLatestTemplateUpdates(state.plan);
            state.updateNotice = true;
            savePlan();
            render();
          };
        }
        const dismissUpdateBtn = document.getElementById("btn-dismiss-update");
        if (dismissUpdateBtn) {
          dismissUpdateBtn.onclick = () => {
            state.updateNotice = false;
            render();
          };
        }
        const addWeekBtn = document.getElementById("btn-add-week");
        if (addWeekBtn) {
          addWeekBtn.onclick = () => {
            state.plan.weeks.push({
              id: uid(),
              name: `Week ${state.plan.weeks.length + 1}`,
              theme: "Custom block",
              days: [
                {
                  id: uid(),
                  label: "Mon",
                  title: "Session",
                  focus: "—",
                  rest: false,
                  exercises: [],
                },
              ],
            });
            savePlan();
            render();
          };
        }
        const dupWeekBtn = document.getElementById("btn-dup-week");
        if (dupWeekBtn) {
          dupWeekBtn.onclick = () => {
            const w = state.plan.weeks[state.weekIndex];
            if (!w) return;
            const copy = JSON.parse(JSON.stringify(w));
            copy.id = uid();
            copy.name = `${w.name} (copy)`;
            copy.days.forEach((d) => {
              d.id = uid();
              d.exercises.forEach((ex) => {
                ex.id = uid();
              });
            });
            state.plan.weeks.splice(state.weekIndex + 1, 0, copy);
            savePlan();
            render();
          };
        }
      }

      function moveExercise(dayId, exId, dir) {
        const found = findDay(dayId);
        if (!found) return;
        const idx = found.day.exercises.findIndex((e) => e.id === exId);
        const next = idx + dir;
        if (idx < 0 || next < 0 || next >= found.day.exercises.length) return;
        const arr = found.day.exercises;
        [arr[idx], arr[next]] = [arr[next], arr[idx]];
        savePlan();
        render();
      }

      document.getElementById("btn-edit").addEventListener("click", () => {
        state.editMode = !state.editMode;
        if (state.editMode) state.openDayId = null;
        render();
      });

      document.getElementById("btn-add-day").addEventListener("click", () => {
        const week = state.plan.weeks[state.weekIndex];
        if (!week) return;
        week.days.push({
          id: uid(),
          label: "New",
          title: "Session",
          focus: "Custom",
          rest: false,
          exercises: [],
        });
        savePlan();
        render();
      });

      document.getElementById("import-file").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            let plan = migratePlan(JSON.parse(String(reader.result)));
            if (planNeedsTemplateUpdate(plan)) {
              plan = applyLatestTemplateUpdates(plan);
              state.updateNotice = true;
            }
            state.plan = plan;
            savePlan();
            render();
          } catch {
            alert("Could not read that file.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      document.getElementById("timer-close").addEventListener("click", closeTimer);
      document.getElementById("timer-overlay").addEventListener("click", (e) => {
        if (e.target.id === "timer-overlay") closeTimer();
      });
      document.getElementById("video-close").addEventListener("click", closeVideoModal);
      document.getElementById("video-overlay").addEventListener("click", (e) => {
        if (e.target.id === "video-overlay") closeVideoModal();
      });

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      function boot() {
        const app = document.getElementById("app");
        try {
          loadWorkoutTemplate();
          state.plan = loadPlan();
          state.updateNotice = pendingUpdateNotice;
          render();
        } catch {
          app.innerHTML =
            '<div class="empty" style="padding:32px 16px">Could not load the workout plan from this page. Refresh and try again.</div>';
        }
      }

      boot();
    </script>
  </body>
</html>
