# Fly.io app config — see DEPLOY.md for first-time setup.
# Rename `app` if jackals-vc is already taken in your Fly org.

app = "jackalsvc"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "file:/data/jackals.db"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  PORT = "3000"
  # Set your live URL after the domain is attached (or override via fly secrets).
  NEXT_PUBLIC_SITE_URL = "https://jackalsvolleyball.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[mounts]]
  source = "jackals_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
