services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://jackalsvolleyball.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/data/jackals.db
      - DATA_DIR=/data
    env_file:
      - .env.production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
